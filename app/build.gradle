plugins {
    id 'com.android.application'
}

android {
    namespace 'com.park.metalmax'
    compileSdk 35
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.park.metalmax"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "0.11"
        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
                cppFlags ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    api project(path: ':optimization')
}
